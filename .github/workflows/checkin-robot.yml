name: Robot Check-in

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: checkin-robot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Exécuter le robot
        run: node scripts/checkin-robot.mjs
        env:
          AIRTABLE_ROBOT_TOKEN: ${{ secrets.AIRTABLE_ROBOT_TOKEN }}
          SLACK_CHECKIN_WEBHOOK_URL: ${{ secrets.SLACK_CHECKIN_WEBHOOK_URL }}
          SLACK_LEADS_WEBHOOK_URL: ${{ secrets.SLACK_LEADS_WEBHOOK_URL }}
